# nginx http context. Plesk: copy to /etc/nginx/conf.d/dictis-rate-limit.conf
# (root SSH), then paste dictis-rate-limit.server.conf into the domain's
# "Additional nginx directives".

# Public IPs that skip these limits (e.g. a large office NAT that trips them in
# normal use). Single /32 public addresses only; never private or
# load-balancer ranges. Laravel's own limiters still apply to them.
geo $dictis_rl_exempt {
    default 0;
    # 203.0.113.10/32 1;
}

map $dictis_rl_exempt $dictis_rl_client {
    1       "";
    default $binary_remote_addr;
}

# An empty key is not counted, so each zone only sees its own paths.
# /index.php/... is matched too: Apache would serve it as path info.
map $uri $dictis_rl_api_key {
    ~^(?:/index\.php)?/(?:api|sanctum)/  $dictis_rl_client;
    ~^/index\.php                        $dictis_rl_client;
    ~^/up/?$                             $dictis_rl_client;
    default                              "";
}

map $uri $dictis_rl_auth_key {
    ~^(?:/index\.php)?/api/(?:login|forgot-password|reset-password)/?$  $dictis_rl_client;
    ~^(?:/index\.php)?/api/2fa/                                         $dictis_rl_client;
    ~^(?:/index\.php)?/sanctum/csrf-cookie/?$                           $dictis_rl_client;
    default                                                             "";
}

limit_req_zone $dictis_rl_api_key  zone=dictis_api:10m  rate=30r/s;
limit_req_zone $dictis_rl_auth_key zone=dictis_auth:10m rate=180r/m;
