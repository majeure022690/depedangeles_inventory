# nginx server context. Plesk: Domains > <domain> > Apache & nginx Settings >
# Additional nginx directives. Needs dictis-rate-limit.http.conf loaded first.
limit_req zone=dictis_api burst=150 nodelay;
limit_req zone=dictis_auth burst=60 nodelay;
limit_req_status 429;
limit_req_log_level warn;
# Uncomment to log would-be rejections without enforcing them.
# limit_req_dry_run on;

error_page 429 @dictis_rate_limited;

location @dictis_rate_limited {
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"message":"Too Many Attempts."}';
}
